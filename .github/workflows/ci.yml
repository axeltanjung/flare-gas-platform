name: CI - FlareGas Intelligence Platform

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest

      - name: Lint with ruff
        run: |
          ruff check backend/ --select E,W,F --ignore E501

      - name: Verify FastAPI app imports
        run: |
          python -c "from backend.api.main import app; print('FastAPI app OK')"

      - name: Verify training pipeline imports
        run: |
          python -c "from backend.training.pipeline import TrainingPipeline; print('Training pipeline OK')"

      - name: Verify emission engine imports
        run: |
          python -c "from backend.emissions.engine import EmissionEngine; print('Emission engine OK')"

      - name: Run tests (if exist)
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v --tb=short
          else
            echo "No tests directory found, skipping"
          fi

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Verify build output
        run: |
          if [ -d "frontend/dist" ]; then
            echo "Build successful - dist/ directory exists"
            ls -la frontend/dist/
          else
            echo "ERROR: dist/ directory not found"
            exit 1
          fi

  docker:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build --no-cache
        timeout-minutes: 15

  data-generator:
    name: Data Generator Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install data dependencies
        run: |
          pip install pandas numpy

      - name: Test synthetic data generation (small sample)
        run: |
          python data/synthetic_flare_gas_generator.py --rows 1000 --output ./data
          echo "Generated dataset:"
          ls -la data/flare_gas_dataset.csv
