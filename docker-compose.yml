version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: flaregas-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - mlflow-data:/app/mlruns
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:///./data/flaregas.db
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MODEL_PATH=/app/models
      - DATA_PATH=/app/data
    depends_on:
      - mlflow
    networks:
      - flaregas-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: flaregas-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - flaregas-network
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    container_name: flaregas-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:///mlflow/mlflow.db
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    networks:
      - flaregas-network
    restart: unless-stopped

volumes:
  mlflow-data:

networks:
  flaregas-network:
    driver: bridge
